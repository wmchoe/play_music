<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheet Music Practice App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button, select {
            padding: 10px 15px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover, select:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        main {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #display-area {
            font-size: 2rem;
            font-weight: bold;
            margin: 20px 0;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .status {
            font-size: 0.9rem;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sheet Music Practice App</h1>
        <p>Microphone Pitch Detection & Web MIDI Enabled</p>
    </header>

    <main>
        <div class="controls">
            <button id="start-mic-btn">Start Microphone</button>
            <button id="stop-mic-btn" disabled>Stop Microphone</button>
            <button id="download-json-btn">Download Session JSON</button>
        </div>

        <div id="display-area">--</div>
        <div class="status" id="midi-status">MIDI: Not connected</div>
        <div class="status" id="mic-status">Mic: Inactive</div>
    </main>

    <script>
        // --- Web MIDI API Setup ---
        const midiStatusEl = document.getElementById('midi-status');
        const displayAreaEl = document.getElementById('display-area');

        function onMIDISuccess(midiAccess) {
            midiStatusEl.textContent = 'MIDI: Ready';
            const inputs = midiAccess.inputs.values();
            for (let input of inputs) {
                input.onmidimessage = getMIDIMessage;
            }
            midiAccess.onstatechange = (e) => {
                midiStatusEl.textContent = `MIDI: ${e.port.name} ${e.port.state}`;
            };
        }

        function onMIDIFailure() {
            midiStatusEl.textContent = 'MIDI: Could not access your MIDI devices.';
        }

        function getMIDIMessage(message) {
            const [command, note, velocity] = message.data;
            // Note on message
            if (command === 144 && velocity > 0) {
                const noteName = midiNoteToName(note);
                displayAreaEl.textContent = `Note: ${noteName} (${note})`;
            }
        }

        function midiNoteToName(midi) {
            const notes = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
            const octave = Math.floor(midi / 12) - 1;
            const name = notes[midi % 12];
            return `${name}${octave}`;
        }

        if (navigator.requestMIDIAccess) {
            navigator.requestMIDIAccess().then(onMIDISuccess, onMIDIFailure);
        } else {
            midiStatusEl.textContent = 'MIDI: Not supported in this browser.';
        }

        // --- Microphone Pitch Detection Setup (Auto-correlation) ---
        let audioContext = null;
        let analyser = null;
        let mediaStream = null;
        let rafId = null;

        const startMicBtn = document.getElementById('start-mic-btn');
        const stopMicBtn = document.getElementById('stop-mic-btn');
        const micStatusEl = document.getElementById('mic-status');

        startMicBtn.addEventListener('click', async () => {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(mediaStream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                source.connect(analyser);

                startMicBtn.disabled = true;
                stopMicBtn.disabled = false;
                micStatusEl.textContent = 'Mic: Active';
                updatePitch();
            } catch (err) {
                alert('Microphone access denied or not supported.');
                console.error(err);
            }
        });

        stopMicBtn.addEventListener('click', () => {
            if (rafId) cancelAnimationFrame(rafId);
            if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
            if (audioContext) audioContext.close();

            startMicBtn.disabled = false;
            stopMicBtn.disabled = true;
            micStatusEl.textContent = 'Mic: Inactive';
            displayAreaEl.textContent = '--';
        });

        function autoCorrelate(buf, sampleRate) {
            const SIZE = buf.length;
            let rms = 0;
            for (let i = 0; i < SIZE; i++) {
                const val = buf[i];
                rms += val * val;
            }
            rms = Math.sqrt(rms / SIZE);
            if (rms < 0.01) return -1; // Not enough signal

            let r1 = 0, r2 = SIZE - 1, thres = 0.2;
            for (let i = 0; i < SIZE / 2; i++) {
                if (Math.abs(buf[i]) < thres) { r1 = i; break; }
            }
            for (let i = 1; i < SIZE / 2; i++) {
                if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
            }

            buf = buf.slice(r1, r2);
            const c = new Float32Array(buf.length);
            for (let i = 0; i < buf.length; i++) {
                for (let j = 0; j < buf.length - i; j++) {
                    c[i] = c[i] + buf[j] * buf[j + i];
                }
            }

            let d = 0;
            while (c[d] > c[d + 1]) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < buf.length; i++) {
                if (c[i] > maxval) {
                    maxval = c[i];
                    maxpos = i;
                }
            }
            let T0 = maxpos;
            return sampleRate / T0;
        }

        const buf = new Float32Array(2048);
        function updatePitch() {
            analyser.getFloatTimeDomainData(buf);
            const acPitch = autoCorrelate(buf, audioContext.sampleRate);

            if (acPitch !== -1) {
                const note = freqToNoteName(acPitch);
                displayAreaEl.textContent = `Pitch: ${note} (${Math.round(acPitch)} Hz)`;
            }

            rafId = window.requestAnimationFrame(updatePitch);
        }

        function freqToNoteNames(frequency) {
            const noteNum = 12 * (Math.log(frequency / 440) / Math.LN2);
            return Math.round(noteNum) + 69;
        }

        function freqToNoteName(freq) {
            const midi = freqToNoteNames(freq);
            return midiNoteToName(midi);
        }

        // --- JSON File Download Setup ---
        const downloadJsonBtn = document.getElementById('download-json-btn');
        downloadJsonBtn.addEventListener('click', () => {
            const practiceData = {
                app: "Sheet Music Practice App",
                timestamp: new Date().toISOString(),
                notesPracticed: [
                    { note: "C4", duration: "4", timestamp: 1 },
                    { note: "E4", duration: "4", timestamp: 2 },
                    { note: "G4", duration: "2", timestamp: 3 }
                ]
            };

            const blob = new Blob([JSON.stringify(practiceData, null, 2)], { type: 'json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'practice-session.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
